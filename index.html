<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro YouTube TV — 90s Guide</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="room">
    <!-- ===== 90s black-plastic TV set ===== -->
    <div class="tv">
      <div class="cabinet">
        <div class="bezel">
          <div class="screen" id="screen">
            <!-- YouTube player (re-positioned for guide vs. full-screen) -->
            <div id="player"></div>

            <!-- NO SIGNAL fallback (shown if a video can't embed) -->
            <div class="no-signal" id="noSignal">
              <div class="ns-bars"></div>
              <div class="ns-text">NO&nbsp;SIGNAL<span>PLEASE STAND BY</span></div>
            </div>

            <!-- ===== Prevue-style on-screen guide ===== -->
            <div class="guide" id="guide">
              <div class="preview-window" id="previewWindow">
                <div class="preview-frame"></div>
                <div class="preview-tag" id="previewTag">NOW PLAYING</div>
              </div>

              <div class="promo">
                <div class="promo-logo">
                  <span class="promo-logo-top">RETRO</span>
                  <span class="promo-logo-bot">GUIDE&nbsp;<b>+</b></span>
                </div>
                <div class="promo-now" id="promoNow">—</div>
                <div class="promo-msg">CH &#9650;&#9660; to browse &middot; WATCH to tune in</div>
                <div class="promo-clock" id="promoClock">--:-- --</div>
              </div>

              <div class="listings">
                <div class="listings-head">
                  <div class="lh-channel">CHANNEL</div>
                  <div class="lh-time" id="slot0">8:00 PM</div>
                  <div class="lh-time" id="slot1">8:30 PM</div>
                  <div class="lh-time" id="slot2">9:00 PM</div>
                </div>
                <div class="listings-viewport">
                  <div class="listings-rows" id="listingsRows"><!-- rows injected --></div>
                </div>
              </div>
            </div>

            <!-- ===== 90s green on-screen display ===== -->
            <div class="osd osd-ch" id="osdCh">
              CH&nbsp;<span id="osdChNum">02</span>
              <span class="nm" id="osdChName">CHANNEL</span>
            </div>

            <div class="osd osd-vol" id="osdVol">
              <span class="spk">&#9834;</span>
              <span class="lbl">VOL</span>
              <div class="vol-bar" id="volBar"><!-- segments injected --></div>
            </div>

            <!-- distortion bits -->
            <div class="rollbar"></div>
            <div class="static" id="static"></div>

            <!-- CRT scanlines + glare -->
            <div class="scanlines"></div>
            <div class="glare"></div>

            <!-- power-off -->
            <div class="power-off" id="powerOff"></div>
          </div>
        </div>

        <!-- Control strip -->
        <div class="front">
          <div class="speaker"><div class="grille"></div></div>

          <div class="badge">
            <div class="brand">FUNTRON</div>
            <div class="sub">STEREO &middot; COLOR</div>
          </div>

          <div class="buttons">
            <button class="btn power" id="powerBtn" title="Power (P)">
              <span class="led" id="led"></span>POWER
            </button>
            <div class="btn-row">
              <button class="btn" id="chDown" title="Channel down">CH&nbsp;&#9660;</button>
              <button class="btn" id="chUp" title="Channel up">CH&nbsp;&#9650;</button>
            </div>
            <div class="btn-row">
              <button class="btn" id="volDown" title="Volume down">VOL&nbsp;&#9660;</button>
              <button class="btn" id="volUp" title="Volume up">VOL&nbsp;&#9650;</button>
            </div>
            <div class="btn-row">
              <button class="btn" id="guideBtn" title="Toggle guide (G)">GUIDE</button>
              <button class="btn" id="watchBtn" title="Watch channel (Enter)">WATCH</button>
            </div>
          </div>
        </div>
      </div>

      <div class="legs"><div class="leg"></div><div class="leg"></div></div>
    </div>

    <div class="hint" id="hint">Press <b>POWER</b> to turn on the TV</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
