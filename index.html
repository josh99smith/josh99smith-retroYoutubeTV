<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0d" />
  <title>Retro YouTube TV — 90s Guide</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="room">
    <!-- ===== 90s black-plastic TV set ===== -->
    <div class="tv">
      <div class="cabinet">
        <div class="bezel">
          <div class="screen" id="screen">
            <!-- YouTube player (re-positioned for guide vs. full-screen) -->
            <div id="player"></div>

            <!-- NO SIGNAL fallback (shown if a video can't embed) -->
            <div class="no-signal" id="noSignal">
              <div class="ns-bars"></div>
              <div class="ns-text" id="nsText">NO&nbsp;SIGNAL<span>PLEASE STAND BY</span></div>
            </div>

            <!-- ===== Prevue-style on-screen guide ===== -->
            <div class="guide" id="guide">
              <button class="preview-window" id="previewWindow" aria-label="Watch the channel shown in the preview">
                <div class="preview-frame"></div>
                <div class="preview-tag" id="previewTag">NOW PLAYING</div>
                <div class="preview-watch">▶ WATCH</div>
              </button>

              <div class="promo">
                <div class="promo-logo">
                  <span class="promo-logo-top">RETRO</span>
                  <span class="promo-logo-bot">GUIDE&nbsp;<b>+</b></span>
                </div>
                <div class="promo-now" id="promoNow">—</div>
                <div class="promo-msg">Tap a show to watch &middot; CH&nbsp;&#9650;&#9660; to surf</div>
                <div class="promo-clock" id="promoClock">--:-- --</div>
              </div>

              <div class="listings">
                <div class="listings-head">
                  <div class="lh-channel">CHANNEL</div>
                  <div class="lh-time" id="slot0">8:00 PM</div>
                  <div class="lh-time" id="slot1">8:30 PM</div>
                  <div class="lh-time" id="slot2">9:00 PM</div>
                </div>
                <div class="listings-viewport" id="listingsViewport">
                  <div class="listings-rows" id="listingsRows"><!-- rows injected --></div>
                </div>
              </div>
            </div>

            <!-- channel "bug" + back-to-guide chip (watch mode) -->
            <div class="chan-bug" id="chanBug">
              <div class="bug-line"><b id="bugNum">02</b><span id="bugName">CHANNEL</span></div>
              <div class="bug-title" id="bugTitle"></div>
            </div>
            <button class="guide-chip" id="guideChip" aria-label="Back to guide">&#8249;&nbsp;GUIDE</button>

            <!-- ===== 90s green on-screen display ===== -->
            <div class="osd osd-ch" id="osdCh">
              CH&nbsp;<span id="osdChNum">02</span>
              <span class="nm" id="osdChName">CHANNEL</span>
            </div>
            <div class="osd osd-vol" id="osdVol">
              <span class="spk" id="osdSpk">&#9834;</span>
              <span class="lbl">VOL</span>
              <div class="vol-bar" id="volBar"><!-- segments injected --></div>
            </div>

            <!-- tap to unmute (mobile-friendly) -->
            <button class="unmute" id="unmuteBtn" aria-label="Tap to unmute">&#128263;&nbsp;TAP TO UNMUTE</button>

            <!-- distortion bits -->
            <div class="rollbar"></div>
            <div class="static" id="static"></div>

            <!-- CRT scanlines + glare -->
            <div class="scanlines"></div>
            <div class="glare"></div>

            <!-- power-off -->
            <div class="power-off" id="powerOff"></div>
          </div>
        </div>

        <!-- Control strip -->
        <div class="front">
          <div class="speaker"><div class="grille"></div></div>

          <div class="badge">
            <div class="brand">FUNTRON</div>
            <div class="sub">STEREO &middot; COLOR</div>
          </div>

          <div class="buttons">
            <button class="btn power" id="powerBtn" aria-label="Power" title="Power (P)">
              <span class="led" id="led"></span>POWER
            </button>
            <div class="btn-row">
              <button class="btn" id="chDown" aria-label="Channel down" title="Channel down">CH&nbsp;&#9660;</button>
              <button class="btn" id="chUp" aria-label="Channel up" title="Channel up">CH&nbsp;&#9650;</button>
            </div>
            <div class="btn-row">
              <button class="btn" id="volDown" aria-label="Volume down" title="Volume down">VOL&nbsp;&#9660;</button>
              <button class="btn" id="volUp" aria-label="Volume up" title="Volume up">VOL&nbsp;&#9650;</button>
            </div>
            <div class="btn-row">
              <button class="btn" id="guideBtn" aria-label="Show guide" title="Guide (G)">GUIDE</button>
              <button class="btn full" id="fullBtn" aria-label="Full screen" title="Full screen (F)">&#9974;&nbsp;FULL</button>
            </div>
          </div>
        </div>
      </div>

      <div class="legs"><div class="leg"></div><div class="leg"></div></div>
    </div>

    <div class="hint" id="hint">Press <b>POWER</b> to turn on the TV</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
